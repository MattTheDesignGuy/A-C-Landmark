<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect to hash-based route for GitHub Pages SPA
      var path = window.location.pathname;
      var repo = '/A-C-Landmark';
      if (path.startsWith(repo)) {
        path = path.slice(repo.length);
      }
      window.location.replace(repo + '/#' + (path || '/'));
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
